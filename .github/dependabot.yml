# Dependency updates (CONTRIBUTING, "Dependencies").
# One PR per ecosystem and week, grouping minor and patch updates, opened
# against develop with a "chore(deps): …" title. Security updates still
# arrive on their own, as soon as an advisory is published.
# Add one block per ecosystem the project uses (npm, pip, uv, swift, docker…),
# copying the github-actions block and changing package-ecosystem and directory.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    commit-message:
      prefix: chore
      include: scope
    labels: []
    groups:
      actions:
        update-types: [minor, patch]
